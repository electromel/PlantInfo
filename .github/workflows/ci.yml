name: CI

# Garde-fou minimal : l'application se compile, les tests JVM passent, le lint ne trouve aucune
# erreur et les cinq langues restent alignées. Les tests de migration Room (app/src/androidTest)
# demandent un appareil ou un émulateur : ils se lancent à la main avant une publication, voir
# CLAUDE.md (« Tests »).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Le démon Gradle exige un JDK JetBrains 21 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Traductions alignées (fr, en, de, it, es)
        run: python3 tools/check_translations.py

      - name: Tests unitaires et lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
